# cloudbuild.yaml (Corrected)
options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _PROJECT_ID: "finto-477904"
  _REGION: "us-central1"
  _REPO: "apps"
  _IMAGE: "finto-service"        # image name in Artifact Registry
  _SERVICE: "finto-service"      # Cloud Run service name
  _RUNTIME_SA: "run-runtime@finto-477904.iam.gserviceaccount.com"

steps:
  - name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args: ["-lc", "echo TAG=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_IMAGE}:${COMMIT_SHA}"]

  - name: gcr.io/cloud-builders/docker
    # ------------------------------------------------------------------
    # 💥 CRITICAL FIX: Enable BuildKit using the environment variable 💥
    env:
      - 'DOCKER_BUILDKIT=1' 
    # ------------------------------------------------------------------
    args:
      ["build",
       "-t","${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_IMAGE}:${COMMIT_SHA}",
       "."]

  - name: gcr.io/cloud-builders/docker
    args:
      ["push",
       "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_IMAGE}:${COMMIT_SHA}"]
       
# ... (rest of the Cloud Run deploy step is unchanged)
  - name: gcr.io/cloud-builders/gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_IMAGE}:${COMMIT_SHA}
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SA}
      - --allow-unauthenticated
      - --port=8000
      # Daily cron loads ~2k+ symbols via yfinance+pandas; 512Mi OOMs mid-request (503).
      - --timeout=900
      - --cpu=1
      - --memory=2Gi
      - --min-instances=0
      - --max-instances=1
      # Secrets must exist in Secret Manager and the runtime SA must have secretAccessor.
      # Ground truth: finto/.env — keep in sync via `make update-secrets` + deploy-tag checks.
      - --set-secrets=ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest
      - --set-secrets=DATABASE_URL=DATABASE_URL:latest
      - --set-secrets=GOOGLE_API_KEY=GOOGLE_API_KEY:latest
      - --set-secrets=GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest
      - --set-secrets=HF_TOKEN=HF_TOKEN:latest
      - --set-secrets=LANGSMITH_API_KEY=LANGSMITH_API_KEY:latest
      - --set-secrets=LANGSMITH_ENDPOINT=LANGSMITH_ENDPOINT:latest
      - --set-secrets=LANGSMITH_PROJECT=LANGSMITH_PROJECT:latest
      - --set-secrets=LANGSMITH_TRACING=LANGSMITH_TRACING:latest
      - --set-secrets=NEWS_MODEL=NEWS_MODEL:latest
      - --set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest
      - --set-secrets=PINECONE_API_KEY=PINECONE_API_KEY:latest
      - --set-secrets=PORTFOLIO_MODEL=PORTFOLIO_MODEL:latest
      - --set-secrets=ROUTER_MODEL=ROUTER_MODEL:latest
      - --set-secrets=SECRET_KEY=SECRET_KEY:latest
      - --set-secrets=SENDGRID_API_KEY=SENDGRID_API_KEY:latest
      - --set-secrets=SENDGRID_FROM_EMAIL=SENDGRID_FROM_EMAIL:latest
      - --set-secrets=SENDGRID_FROM_NAME=SENDGRID_FROM_NAME:latest
      - --set-secrets=TAVILY_API_KEY=TAVILY_API_KEY:latest
      - --set-secrets=TIMESCALE_DATABASE_URL=TIMESCALE_DATABASE_URL:latest
      - --set-secrets=THESYS_API_KEY=THESYS_API_KEY:latest
      - --set-secrets=THESYS_BASE_URL=THESYS_BASE_URL:latest
      - --set-secrets=THESYS_ENABLED=THESYS_ENABLED:latest
      - --set-secrets=THESYS_MODEL=THESYS_MODEL:latest
      - --set-secrets=WA_APP_SECRET=WA_APP_SECRET:latest
      - --set-secrets=WA_PHONE_NUMBER_ID=WA_PHONE_NUMBER_ID:latest
      - --set-secrets=WA_SENDER_E164=WA_SENDER_E164:latest
      - --set-secrets=WA_USER_OR_SYSTEM_TOKEN=WA_USER_OR_SYSTEM_TOKEN:latest
      - --set-secrets=WA_VERIFY_TOKEN=WA_VERIFY_TOKEN:latest
      - --set-secrets=ALPACA_API_KEY=ALPACA_API_KEY:latest
      - --set-secrets=ALPACA_API_SECRET=ALPACA_API_SECRET:latest
      - --set-secrets=ALPACA_STREAM_URL=ALPACA_STREAM_URL:latest
      - --set-secrets=DEMO_US_STOCK_SIMULATE=DEMO_US_STOCK_SIMULATE:latest
      - --set-secrets=DEMO_US_STOCK_SIMULATE_TICK_SECONDS=DEMO_US_STOCK_SIMULATE_TICK_SECONDS:latest
      # Cookie settings for cross-origin requests (allows localhost:3000)
      # NOTE: For cross-origin (localhost:3000 → Cloud Run), browsers REQUIRE:
      # - SameSite=None + Secure=True (minimum required, can't be less secure)
      # For local testing (both on localhost), you can use: SameSite=lax + Secure=false
      - --set-env-vars=COOKIE_SAMESITE=none,COOKIE_SECURE=true

images:
  - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_IMAGE}:${COMMIT_SHA}"
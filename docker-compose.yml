services:
  api:
    container_name: finto-api
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Required
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      # Optional
      # US stocks demo only. TimescaleDB runs in docker-compose.demo-us-stocks.yml,
      # a separate compose project, so reach it through the host port it publishes.
      TIMESCALE_DATABASE_URL: ${TIMESCALE_DATABASE_URL:-postgresql://arthik:arthik@host.docker.internal:5433/arthik_timeseries}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      COOKIE_NAME: ${COOKIE_NAME:-access_token}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_HTTPONLY: ${COOKIE_HTTPONLY:-true}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      WA_VERIFY_TOKEN: ${WA_VERIFY_TOKEN:-}
      WA_APP_SECRET: ${WA_APP_SECRET:-}
      WA_USER_OR_SYSTEM_TOKEN: ${WA_USER_OR_SYSTEM_TOKEN:-}
      WA_PHONE_NUMBER_ID: ${WA_PHONE_NUMBER_ID:-}
      WA_API_VERSION: ${WA_API_VERSION:-v22.0}
      KITE_API_KEY: ${KITE_API_KEY:-}
      KITE_API_SECRET: ${KITE_API_SECRET:-}
      SMALLCASE_GATEWAY_NAME: ${SMALLCASE_GATEWAY_NAME:-}
      SMALLCASE_GATEWAY_API_SECRET: ${SMALLCASE_GATEWAY_API_SECRET:-}
      SMALLCASE_GATEWAY_JWT_SECRET: ${SMALLCASE_GATEWAY_JWT_SECRET:-}
      FRONTEND_BASE: ${FRONTEND_BASE:-http://localhost:3000}
      PORT: ${PORT:-8000}
    ports:
      - "8000:8000"
    # `.env` sets TIMESCALE_DATABASE_URL to localhost:5433 for host processes
    # (make run-apis, the Spark job). Running the API in this container instead
    # means overriding it with host.docker.internal:5433, which this mapping
    # makes resolvable on Linux as well as macOS.
    extra_hosts:
      - "host.docker.internal:host-gateway"

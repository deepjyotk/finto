[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finto"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<4.0.0"
dependencies = [
    "fastapi>=0.121.0",
    "httpx>=0.28.1",
    "langgraph>=1.0.2",
    "python-json-logger>=3.2.1",
    "uvicorn>=0.38.0",
    "pyjwt>=2.10.1",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.20", # Required for FastAPI File uploads
    "email-validator>=2.2.0", # Required for Pydantic email validation
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "pydantic>=2.0.0", # Explicit: used directly in schemas
    "pydantic-settings>=2.0.0",
    "greenlet>=3.0.0,<4.0.0", # Required for SQLAlchemy async
    "yfinance>=0.2.66",
    "langchain-core>=1.0.0", # Explicit: used directly throughout
    "langchain-openai>=1.0.2",
    "openpyxl>=3.1.5", # Required for pd.read_excel() - .xlsx files
    "xlrd>=2.0.1", # Required for pd.read_excel() - .xls files
    "msoffcrypto-tool>=5.0.0", # Required for decrypting password-protected Excel files
    "langchain-tavily>=0.2.13",
    "kiteconnect>=5.0.1",
    "google-auth>=2.35.0",
    "gspread>=6.1.2",
    "alembic>=1.17.1",
    "pandas>=2.2.0",
    "numpy>=2.0.0", # Explicit: used in portfolio_risk.py
    "langgraph-checkpoint-postgres>=2.0.0",
    "pinecone>=7.3.0",
    "psycopg>=3.2.0", # Explicit: used directly in chat services
    "psycopg-pool>=3.2.0", # Explicit: used in graph.py
    "thesys-genui-sdk>=0.1.0",
    "sendgrid>=6.11.0", # SendGrid Python SDK for email sending
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "google-cloud-storage>=2.16.0", # GCS bucket upload for company logos
    "boto3>=1.34.0", # Cloudflare R2 (S3-compatible) for CDN logo delivery
]

[dependency-groups]
dev = [
    "autoflake>=2.3.1",
    "bandit>=1.8.6",
    "black>=25.9.0",
    "deptry>=0.15.0", # Detect unused and missing dependencies
    "flake8>=7.3.0",
    "isort>=7.0.0",
    "mypy>=1.18.2",
    "pre-commit>=4.3.0",
    "ruff>=0.14.3",
    # "pygraphviz>=1.14",  # Commented: requires Graphviz C libraries on Windows; use grandalf for LangGraph viz instead
    "grandalf>=0.8", # Alternative for LangGraph visualization without C dependencies
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.deptry]
ignore = [
    "DEP003",  # Ignore transitive dependency warnings (we've made key ones explicit)
]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.flake8]
max-line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_unused_ignores = true
ignore_missing_imports = true

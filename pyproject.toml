[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finto"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<4.0.0"
dependencies = [
    "fastapi>=0.121.0",
    "httpx>=0.28.1",
    "langchain>=1.0.3",
    "langgraph>=1.0.2",
    "python-json-logger>=3.2.1",
    "uvicorn>=0.38.0",
    "pyjwt>=2.10.1",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.20",
    "email-validator>=2.2.0",
    "sqlparse>=0.5.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "pydantic-settings>=2.0.0",
    "greenlet>=3.0.0,<4.0.0",
    "yfinance>=0.2.66",
    "langchain-openai>=1.0.2",
    "langchain-community>=0.4.1",
    "tavily>=1.1.0",
    "tenacity>=8.2.0",
    "openpyxl>=3.1.5",
    "tabulate>=0.9.0",
    "langchain-tavily>=0.2.13",
    "kiteconnect>=5.0.1",
    "langchain-experimental>=0.4.0",
]

[dependency-groups]
dev = [
    "autoflake>=2.3.1",
    "bandit>=1.8.6",
    "black>=25.9.0",
    "flake8>=7.3.0",
    "isort>=7.0.0",
    "mypy>=1.18.2",
    "pre-commit>=4.3.0",
    "ruff>=0.14.3",
]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.flake8]
max-line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_unused_ignores = true
ignore_missing_imports = true
